<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/logo/logo_1.png" />
    <title>Votre panier de produit</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body style="background-color: rgb(236, 235, 235)">
    <header id="topPage">
      <!-- logo du site -->
      <div class="logo">
        <img
          id="logo"
          src="assets/logo/logo_1.jpg"
          alt="Logo de la boutique"
          height="auto"
        />
        <h1>Vibekicks</h1>
      </div>
      <!-- Navigation dans le site -->
      <nav id="navbar">
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li style="margin: 0"><a href="index.html">Catalogue</a></li>

          <li id="icon-panier">
            <a href="cart.html"
              ><ion-icon
                name="cart-outline"
                style="font-size: 1.2rem"
              ></ion-icon
            ></a>
            <div id="notif"></div>
          </li>

          <li><a href="#">Connexion</a></li>
          <li>
            <button id="button-action">Inscription</button>
          </li>
        </ul>
      </nav>
    </header>

    <div id="container-panier">
      <div id="panier">
        <div id="name-number_article">
          <h3>Panier</h3>
          <p id="number-article"></p>
        </div>

        <div id="product-content"></div>
      </div>
      <div id="resume-panier">
        <h3>Résumé du panier</h3>
        <div id="number-article">
          <p>Article</p>
          <p class="number"></p>
        </div>
        <div id="somme-total">
          <p>Total</p>
          <h2 class="somme">00.0 FCFA</h2>
        </div>
        <button id="command">COMMANDER</button>
      </div>
    </div>

    <!-- Le pied de page du site -->
    <footer id="foot-page">
      <div id="left">
        <div class="logo">
          <img
            src="assets/logo/logo_1.jpg"
            alt="Logo de la boutique"
            height="auto"
          />
          <h1>Vibekicks</h1>
        </div>
        <p class="description">
          Votre boutique de baskets moderne, qui transforme votre style.
        </p>
      </div>

      <div id="center">
        <h3>Liens Utiles</h3>
        <ul>
          <li><a href="#">Conditions Generales</a></li>
          <li><a href="#">Politique de confidentialité</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>

      <div id="right">
        <h3>Newsletter</h3>
        <div id="form-news-letter">
          <input
            type="email"
            id="email"
            placeholder="Votre email"
            maxlength="20"
          />
          <button class="subscribe">S'abonner</button>
        </div>
      </div>
    </footer>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script type="module" src="js/ui/renderPanier.js"></script>
  </body>
</html>
